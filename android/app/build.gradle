plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Enable this after adding real google-services.json files for each flavor.
    // id "com.google.gms.google-services"
}

android {
    namespace = "com.sr.kickstack"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    flavorDimensions "environment"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // KickStack: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.sr.kickstack"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
        }

        uat {
            dimension "environment"
            applicationIdSuffix ".uat"
        }

        prod {
            dimension "environment"
        }
    }

    buildTypes {
        release {
            // KickStack: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
