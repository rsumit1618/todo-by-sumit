name: data
description: "Data layer for the KickStack starter."
version: 0.0.1
homepage:
publish_to: none


environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter


  domain:
    path: ../domain
  flutter_riverpod: ^3.2.1
  flutter_secure_storage: ^9.2.4
  sqlite3: ^2.7.6
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dio: ^5.9.1
  pretty_dio_logger: ^1.4.0
  http_certificate_pinning: ^3.0.1
  retrofit: 4.6.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  retrofit_generator: ^9.7.0

